name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm messages:check
      - run: pnpm typecheck
      - run: pnpm test:coverage

  integration:
    name: Database, build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (Postgres, Auth, REST)
        run: pnpm db:start
      - name: Write .env.local from the local stack
        run: pnpm db:env
      - name: Database tests (exclusion constraint, slot rules, RLS, reminders)
        run: pnpm test:db
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: pnpm db:stop

  deploy:
    name: Migrate and deploy to Vercel
    needs: [quality, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm exec supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
      - name: Pull Vercel environment
        run: pnpm dlx vercel@66.4.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: pnpm dlx vercel@66.4.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: pnpm dlx vercel@66.4.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
